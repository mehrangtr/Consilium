name: Package and verify P04 manual-round delivery
'on':
  push:
    branches: [ops-p04-manual-rounds-rescue-20261007]
permissions:
  contents: write
  actions: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.pack.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: 53555c5d163a4e6e027f05d2b0f281a504cf5fcc
          path: payload
          persist-credentials: true
      - uses: actions/setup-python@v7
        timeout-minutes: 5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r payload/requirements.lock
        timeout-minutes: 5
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: native-target-Linux
          path: payload/evidence/targets/Linux
          github-token: ${{ github.token }}
          repository: mehrangtr/Consilium
          run-id: 37660566040
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: development-supervisor-Linux
          path: payload/evidence/development-supervisor
          github-token: ${{ github.token }}
          repository: mehrangtr/Consilium
          run-id: 37660566040
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: native-target-Windows
          path: payload/evidence/targets/Windows
          github-token: ${{ github.token }}
          repository: mehrangtr/Consilium
          run-id: 37660566040
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: development-supervisor-Windows
          path: payload/evidence/development-supervisor
          github-token: ${{ github.token }}
          repository: mehrangtr/Consilium
          run-id: 37660566040
      - name: Package exact native evidence and publish isolated delivery branch
        id: pack
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ROOT: ${{ github.workspace }}/payload
          TESTED_CODE_SHA: 53555c5d163a4e6e027f05d2b0f281a504cf5fcc
          TESTED_CODE_TREE: ae2db99dc2972710200423a0b5e577fb189f20ce
          TESTED_SOURCE_DIGEST: e97465f7dfe8c2977f1d2058021d41bc0040dffa4145cfff2c9776372b6d35be
          NATIVE_RUN_ID: '37660566040'
          PUBLICATION_JOURNAL_SHA: eb3f9c16f6f9ebfa721a08799a3455ca6fdd23be
          DELIVERY_BRANCH: p04-manual-round-delivery-20261007
        shell: bash
        run: |
          python - <<'PY'
          import base64,datetime as dt,hashlib,json,os,subprocess,sys,urllib.request,zipfile
          from pathlib import Path
          ROOT=Path(os.environ['PAYLOAD_ROOT']).resolve()
          CODE=os.environ['TESTED_CODE_SHA']; TREE=os.environ['TESTED_CODE_TREE']; SOURCE=os.environ['TESTED_SOURCE_DIGEST']
          RUN=int(os.environ['NATIVE_RUN_ID']); BRANCH=os.environ['DELIVERY_BRANCH']; JOURNAL=os.environ['PUBLICATION_JOURNAL_SHA']
          sys.path.insert(0,str(ROOT/'tools'))
          import qualityctl as q
          from publication_guard import PublicationGuard
          def command(args,timeout=120):
              subprocess.run(args,cwd=ROOT,stdin=subprocess.DEVNULL,check=True,timeout=timeout)
          def github(path):
              req=urllib.request.Request('https://api.github.com/repos/mehrangtr/Consilium/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=25) as response:return json.load(response)
          def snapshots():
              out=[]
              for path in sorted((ROOT/'evidence/development-supervisor').glob('*/STATE.json')):
                  state=q.load(path)
                  if state['source_digest']!=SOURCE:continue
                  assert state['status']=='PASS' and not state['phase_advanced'] and not state['remaining_steps']
                  for step in state['steps']:
                      assert step['status'] in {'COMPLETE','RECOVERED_COMPLETE'}
                      proof=step['reconciliation'];assert proof['status']=='VERIFIED_COMPLETE'
                      receipt=q.load(q.artifact(ROOT,{'path':proof['receipt'],'sha256':proof['sha256']}))
                      assert receipt['development_step_id']==step['nonce'] and receipt['status']=='PASS'
                      assert receipt['source_digest_before']==receipt['source_digest_after']==SOURCE
                      assert not step['retained_proof']['errors']
                      for ref in step['retained_proof']['artifacts']:q.artifact(ROOT,{'path':ref['path'],'sha256':ref['sha256']})
                  out.append({'path':path.relative_to(ROOT).as_posix(),'sha256':q.digest(path.read_bytes()),'state':state})
              return out
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=ROOT).decode().strip()==CODE
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=ROOT).decode().strip()==TREE
          assert q.source_digest(ROOT)==SOURCE
          run=github('actions/runs/'+str(RUN));assert run['head_sha']==CODE and run['status']=='completed' and run['conclusion']=='success'
          command([sys.executable,'tools/check_target_matrix.py'])
          _,native=q.target_evidence_files(ROOT)
          assert {r['target'] for r in native}=={'Windows','Linux'} and all(r['status']=='PASS' and r['source_matches_current'] for r in native)
          for r in native:
              report=q.load(ROOT/r['report']['path'])
              parts={role:q.load(q.artifact(ROOT,ref)) for role,ref in report['artifacts'].items() if role in {'control_report','foundation_report','persistence_report','browser_probe_report','architect_report'}}
              assert {role:p['counts']['tests'] for role,p in parts.items()}=={'control_report':112,'foundation_report':60,'persistence_report':80,'browser_probe_report':44,'architect_report':220}
              assert all(p['counts']['failures']==p['counts']['errors']==p['counts']['skipped']==0 for p in parts.values())
              exits=[c for role,p in parts.items() if role!='control_report' for c in p['cases'] if 'process_exit' in c['id']]
              assert len(exits)==29 and all(c['status']=='PASS' for c in exits)
          assert len([s for s in snapshots() if s['state']['steps'][0]['step']=='native'])==2
          raw=base64.b64decode(github('git/blobs/'+JOURNAL)['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==JOURNAL
          publication=json.loads(raw)
          assert publication['code_commit']==CODE and publication['code_tree']==TREE and publication['source_digest']==SOURCE
          assert all(r['state']=='VERIFIED_COMPLETE' for r in publication['operations'])
          assert publication['commit_creation']['status']=='VERIFIED_COMPLETE'
          assert publication['previous_publication_reconciliation']['status']=='VERIFIED_COMPLETE'
          assert publication['previous_publication_reconciliation']['mutation_replayed'] is False
          assert publication['previous_publication_reconciliation']['receipt_commit']=='22cd94156b0853999081f6ced0efa9ccd21cf323'
          assert q.load(ROOT/'evidence/publication/EXTERNAL_ROUND_PUBLICATION_CHECKPOINT.json')['publication_complete'] is True
          attempts=q.load(ROOT/'evidence/p04/MANUAL_ROUND_LOCAL_ATTEMPTS.json')
          attempts['remote_packaging_failure']={"workflow_run_id":37663677135,"job_id":112937317840,"artifact_id":11500769771,"artifact_sha256":"96d72e58690012c9a1907de16211ecbe2cae3c6f4de479e69191cd16da610a62","status":"PACKAGING_FAILURE_BEFORE_PUBLICATION","product_tests_failed":0,"cause":"Packaging helper expected an import summary label instead of the durable journal's actual VERIFIED_COMPLETE state.","fix":"Require exact VERIFIED_COMPLETE, mutation_replayed false and original verified receipt commit; preserve all source/native assertions.","delivery_ref_absence_independently_verified":True,"test_assertions_removed":False}
          (ROOT/'evidence/p04/MANUAL_ROUND_LOCAL_ATTEMPTS.json').write_bytes(q.encoded(attempts))
          progress=q.load(ROOT/'PROGRESS.json')
          accepted={p['id']:q.encoded(p) for p in progress['phases'] if p['id'] in {'P00','P01','P02','P03'}}
          assert progress['current_phase']=='P04' and progress['verified_application_requirements']==0
          phase=next(p for p in progress['phases'] if p['id']=='P04');assert phase['status']=='IN_PROGRESS'
          now=dt.datetime.now(dt.timezone.utc).isoformat()
          next_action='در P04-002 تطبیق صریح عملیات قبلی را طراحی و آزمون کن؛ سپس منشأ زنده و مشاهده و اندازه‌گیری معتبر اتصال و همهٔ معیارهای P04 را بازبینی کن. نقد دستی، پاسخ دورهای بعد و جای ورود چندخطی تکمیل شده‌اند؛ دوباره نساز. P05 و ارسال زنده هنوز آغاز نشوند.'
          resume=progress['resume'];resume['working_changes']=[]
          resume['completed_work'].append('Manual critique batches, later answers, V8 migration and multiline initial/later CLI entry verified: 516 tests and 29 actual product process exits on each native OS; zero skipped tests or live calls. Full P04 remains open.')
          resume['next_action']=next_action;resume['next_command']='python tools/development_supervisor.py local'
          resume['next_task'].update(status='MANUAL_ROUND_AND_ENTRY_NATIVE_VERIFIED',completed_fa='نقد دستی چندهدفه و پاسخ دستی دورهای بعد و ورود چندخطی اولیه و بعدی، همراه نسخهٔ هشت پایگاه، تکمیل شدند؛ ۵۱۶ آزمون و ۲۹ قطع واقعی پردازهٔ محصول در هر دو محیط موفق‌اند.',remaining_fa='تطبیق صریح عملیات قبلی، منشأ زنده و مشاهده و اندازه‌گیری معتبر اتصال و بازبینی و پذیرش کامل P04.',next_action_fa=next_action)
          resume['unfinished_work']['updated_at_utc']=now;resume['unfinished_work']['items'][0]=resume['next_task'].copy()
          resume['unfinished_work']['continuation_instruction']='Continue explicit prior-product-operation reconciliation in P04-002, then trusted live observation and full P04 exit review. Do not rebuild completed manual/round/source slices or replay P03. P05 remains blocked.'
          resume['previous_publication_reconciliation']={'status':'VERIFIED_COMPLETE','main':'22cd94156b0853999081f6ced0efa9ccd21cf323','pr':9,'native_runs':[37642514269,37646529622],'handoff_files':824,'local_journal_import':'COMPLETE_WITHOUT_REPLAY'}
          resume['native_evidence']={'run_id':str(RUN),'code_commit':CODE,'source_digest':SOURCE,'tests_per_target':516,'process_exit_cases_per_target':29,'target_reports':native}
          resume['transfer_reviewed_file_count']=None;resume['developer_supervisor']['native_verified']=True
          resume['external_publication_guard'].update(journal_blob=JOURNAL,current_source_tree_verified=True,local_new_publication_journal_sync='DEFERRED_WHILE_LOCAL_EXECUTOR_UNAVAILABLE')
          resume['known_quirks']=[('HISTORICAL: '+x) if 'Manual critiques and later-round manual answers still pending' in x else x for x in resume['known_quirks']]
          resume['known_quirks'].append('Manual later answers/critiques use exact historical canonical views and explicit destination grants; no remote token/history proof is minted. Existing operations still block manual replacement until explicit reconciliation. GUI entry remains P12.')
          progress['application_source_commit']=CODE;progress['updated_at_utc']=now;phase['source_commit']=CODE
          phase['notes']=[('HISTORICAL: '+x) if x.startswith('CURRENT') else x for x in phase['notes']]
          phase['notes'].append('CURRENT: manual round and CLI entry verified for '+SOURCE+'; 516 tests and 29 product process exits per native OS. Full P04 open; no live calls.')
          phase['outputs']=sorted(set(phase['outputs'])|{'src/consilium/core/manual_rounds.py','src/consilium/shell/manual_rounds.py','src/consilium/shell/manual_round_review.py','src/consilium/shell/manual_entry.py','src/consilium/shell/schema_v8.py','tools/manual_round.py','tests/architect/test_manual_rounds.py','docs/P04_MANUAL_ROUND_RUNBOOK_FA.md','evidence/p04/MANUAL_ROUND_CHECKPOINT.json','evidence/p04/MANUAL_ROUND_REVIEW.json'})
          (ROOT/'PROGRESS.json').write_bytes(q.encoded(progress));q.navigation(ROOT)
          command([sys.executable,'tools/development_supervisor.py','phase'],timeout=180)
          latest,_=q.latest_phase_run(ROOT,'P04',progress['plan_version']);assert latest['status']=='PASS' and latest['source_matches_current']
          phase['tests']=[latest['receipt']];states=snapshots();assert any(s['state']['steps'][0]['step']=='phase' for s in states)
          cp=ROOT/'evidence/p04/MANUAL_ROUND_CHECKPOINT.json';checkpoint=q.load(cp)
          checkpoint.update(status='MANUAL_ROUND_AND_ENTRY_NATIVE_VERIFIED_NOT_PHASE_ACCEPTED',source_digest=SOURCE,code_commit=CODE,native_run_id=str(RUN),target_reports=native,configured_phase_run=latest,tests_per_native_target=516,product_process_exit_cases_per_native_target=29,development_supervisor_snapshots=states,publication_journal={'blob':JOURNAL,'sha256':q.digest(raw),'snapshot':publication},native_evidence='ACTUAL_WINDOWS_AND_LINUX_GRAPH_VERIFIED',phase_accepted=False,next_action=next_action,publication_scope='VERIFIED_DELIVERY_BRANCH_MAIN_PUBLICATION_PENDING')
          checkpoint['local_native']['scope']='LOCAL_AUTHOR_RECORD_NOT_INCLUDED_AS_PUBLIC_NATIVE_PROOF'
          cp.write_bytes(q.encoded(checkpoint))
          resume['last_verified_in_phase_checkpoint']={'phase':'P04','path':cp.relative_to(ROOT).as_posix(),'sha256':q.digest(cp.read_bytes()),'source_digest':SOURCE,'phase_accepted':False}
          resume['developer_supervisor']['latest_state_snapshots']={'path':cp.relative_to(ROOT).as_posix(),'sha256':q.digest(cp.read_bytes())}
          review=q.load(ROOT/'evidence/p04/MANUAL_ROUND_REVIEW.json')
          review.update(status='PASS_IMPLEMENTED_SLICE_NATIVE_VERIFIED',source_digest=SOURCE,code_commit=CODE,native_run_id=str(RUN),target_reports=native,configured_phase_run=latest,tests_per_native_target=516,product_process_exit_cases_per_native_target=29,phase_accepted=False)
          review['local_native']['scope']='LOCAL_AUTHOR_RECORD_NOT_INCLUDED_AS_PUBLIC_NATIVE_PROOF'
          for criterion in review['criteria']:
              if criterion['id'] in {'native_windows_linux','migration_and_crash'}:criterion.update(result='PASS',reason=criterion['reason']+' Fresh exact-source Windows/Linux graphs verified.')
          (ROOT/'evidence/p04/MANUAL_ROUND_REVIEW.json').write_bytes(q.encoded(review))
          (ROOT/'PROGRESS.json').write_bytes(q.encoded(progress))
          assert accepted=={p['id']:q.encoded(p) for p in progress['phases'] if p['id'] in accepted}
          q.navigation(ROOT);assert q.source_digest(ROOT)==SOURCE
          output=ROOT.parent/'delivery';output.mkdir(exist_ok=True)
          preview=output/'P04_MANUAL_ROUND_PREVIEW.zip';q.handoff(ROOT,preview);preview_result=q.verify(preview)
          resume['transfer_reviewed_file_count']=preview_result['files'];(ROOT/'PROGRESS.json').write_bytes(q.encoded(progress));q.navigation(ROOT)
          archive=output/'P04_MANUAL_ROUND_HANDOFF.zip';info=q.handoff(ROOT,archive);verified=q.verify(archive)
          assert verified['files']==preview_result['files'] and info['source_snapshot_digest']==SOURCE and info['state_label']=='INCOMPLETE'
          assert info['current_phase']=='P04' and info['last_accepted_phase']=='P03'
          assert info['latest_current_phase_run']['status']=='PASS' and info['latest_current_phase_run']['source_matches_current']
          assert all(r['status']=='PASS' and r['source_matches_current'] for r in info['native_target_runs'])
          with zipfile.ZipFile(archive) as z:
              for name in ('HANDOFF.json','MANIFEST.json'):(ROOT/name).write_bytes(z.read(name))
          command(['git','add','PROGRESS.json','HANDOFF.json','MANIFEST.json','evidence'])
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],cwd=ROOT).decode().splitlines()
          assert all(n in {'PROGRESS.json','HANDOFF.json','MANIFEST.json'} or n.startswith('evidence/') for n in changed)
          assert q.source_digest(ROOT)==SOURCE
          command(['git','config','user.name','Consilium verified delivery']);command(['git','config','user.email','consilium-delivery@users.noreply.github.com'])
          command(['git','commit','-m','Record actual native manual-round evidence and precise P04 continuation'])
          commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=ROOT).decode().strip();tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=ROOT).decode().strip()
          guard=PublicationGuard(ROOT.parent/'publication-workflow.sqlite3')
          plan={'kind':'REF_UPDATE','resource':'mehrangtr/Consilium/refs/heads/'+BRANCH,'expected_sha':commit,'request_sha256':q.digest(q.encoded({'branch':BRANCH,'commit':commit,'expected':'ABSENT'})),'source_digest':SOURCE}
          record=guard.prepare(plan);permit=guard.begin(record['id'],wait_seconds=25)
          (output/'REF_PUBLICATION_PLAN.json').write_bytes(q.encoded({'plan':plan,'permit':permit,'automatic_retry':False}))
          try:command(['git','push','origin','HEAD:refs/heads/'+BRANCH],timeout=25)
          except (subprocess.TimeoutExpired,subprocess.CalledProcessError):guard.unknown(record['id'],nonce=permit['nonce'],reason='CONNECTOR_ERROR')
          observed=github('git/ref/heads/'+BRANCH)['object']['sha'];assert observed==commit
          final=guard.reconcile(record['id'],nonce=permit['nonce'],observed_sha=observed);guard.close()
          result={'status':'VERIFIED_DELIVERY_BRANCH_PUSHED','commit':commit,'tree':tree,'source_digest':SOURCE,'code_commit':CODE,'native_run_id':str(RUN),'configured_receipt':latest['receipt'],'files':verified['files'],'zip_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'tests_per_target':516,'product_process_exit_cases_per_target':29,'phase_accepted':False,'supervisor_snapshots':len(states),'changed_paths':len(changed),'product_source_changes':0,'publication_journal_blob':JOURNAL,'delivery_ref_journal':final,'primary_main_publication':'PENDING_PRIMARY_REF_CHECK'}
          (output/'PUBLICATION_RESULT.json').write_bytes(q.encoded(result))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+commit+'\n')
          print('PACKAGING_RESULT='+json.dumps(result))
          PY
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        if: always()
        with:
          name: verified-manual-round-handoff
          path: |
            delivery/
            payload/evidence/development-supervisor/
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: package
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: ${{ needs.package.outputs.commit }}
          path: verified-source
          persist-credentials: false
      - uses: actions/setup-python@v7
        timeout-minutes: 5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r verified-source/requirements.lock
        timeout-minutes: 5
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: verified-manual-round-handoff
          path: downloaded
      - name: Independently verify archive, Git blobs and native graph
        timeout-minutes: 5
        env:
          DELIVERY_COMMIT: ${{ needs.package.outputs.commit }}
          TESTED_SOURCE_DIGEST: e97465f7dfe8c2977f1d2058021d41bc0040dffa4145cfff2c9776372b6d35be
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys,zipfile
          from pathlib import Path
          root=Path('verified-source').resolve();sys.path.insert(0,str(root/'tools'))
          import qualityctl as q
          a=next(Path('downloaded').rglob('P04_MANUAL_ROUND_HANDOFF.zip'))
          r=json.loads(next(Path('downloaded').rglob('PUBLICATION_RESULT.json')).read_text())
          commit=os.environ['DELIVERY_COMMIT'];source=os.environ['TESTED_SOURCE_DIGEST']
          assert r['commit']==commit and r['source_digest']==source and r['tests_per_target']==516 and r['product_process_exit_cases_per_target']==29
          assert hashlib.sha256(a.read_bytes()).hexdigest()==r['zip_sha256']
          verified=q.verify(a);assert verified['files']==r['files']
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root).decode().strip()==commit
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=root).decode().strip()==r['tree']
          assert q.source_digest(root)==source
          entries=subprocess.check_output(['git','ls-tree','-r','HEAD'],cwd=root).decode().splitlines()
          blobs={line.split('\t',1)[1]:line.split('\t',1)[0].split()[2] for line in entries}
          with zipfile.ZipFile(a) as z:
              names=z.namelist()
              for n in names:
                  b=z.read(n);assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==blobs[n],n
              h=json.loads(z.read('HANDOFF.json'))
              assert h['source_snapshot_digest']==source and h['state_label']=='INCOMPLETE' and h['current_phase']=='P04' and h['last_accepted_phase']=='P03'
              assert h['latest_current_phase_run']['status']=='PASS' and h['latest_current_phase_run']['source_matches_current']
              assert all(t['status']=='PASS' and t['source_matches_current'] for t in h['native_target_runs'])
          subprocess.run([sys.executable,'tools/check_target_matrix.py'],cwd=root,check=True,timeout=120)
          report={**r,'verification_status':'PASS','zip_git_blob_files_matched':len(names),'public_phase_accepted':False,'same_author_separate_verification_job':True,'reviewer_independent':False}
          Path('VERIFIED_PUBLICATION_RESULT.json').write_bytes(q.encoded(report))
          print('VERIFIED_PUBLICATION_RESULT='+json.dumps(report))
          PY
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: manual-round-delivery-verification
          path: VERIFIED_PUBLICATION_RESULT.json
          if-no-files-found: error
          retention-days: 7
